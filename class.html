<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Class | Hogwarts Academy</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <header>

        <h1>
            🏰 Hogwarts Academy
        </h1>

        <p>
            School of Witchcraft and Wizardry
        </p>

    </header>


    <main>

        <section class="class-container">


            <!-- CLASS HEADER -->

            <div class="class-header">

                <div
                    id="classIcon"
                    class="class-icon"
                >
                    ✨
                </div>

                <h2 id="className">
                    Charms
                </h2>

                <p id="classProfessor">
                    Professor Flitwick
                </p>

                <p id="classDescription">
                    Master the art of magical charms and
                    enchantments.
                </p>

            </div>


            <!-- PROGRESS -->

            <div class="course-progress">

                <div class="progress-heading">

                    <strong>
                        Course Progress
                    </strong>

                    <span id="progressText">
                        0%
                    </span>

                </div>

                <div class="progress-bar">

                    <div
                        id="progressFill"
                        class="progress-fill"
                    ></div>

                </div>

            </div>


            <!-- LESSONS -->

            <section class="course-section">

                <h2>
                    📚 Lessons
                </h2>


                <div
                    id="lessonsList"
                    class="course-list"
                ></div>


            </section>


            <!-- COURSEWORK -->

            <section class="course-section">

                <h2>
                    📝 Coursework
                </h2>


                <div class="coursework-grid">


                    <button
                        onclick="showComingSoon('Assignments')"
                    >

                        📝

                        <span>
                            Assignments
                        </span>

                        <small>
                            View assignments
                        </small>

                    </button>


                    <button
                        onclick="showComingSoon('Quizzes')"
                    >

                        🧠

                        <span>
                            Quizzes
                        </span>

                        <small>
                            View quizzes
                        </small>

                    </button>


                    <button
                        onclick="showComingSoon('Practical Work')"
                    >

                        🪄

                        <span>
                            Practical Work
                        </span>

                        <small>
                            Complete practical work
                        </small>

                    </button>


                </div>

            </section>


            <button
                class="back-button"
                onclick="goBack()"
            >
                ← Back to Classes
            </button>


        </section>

    </main>


    <footer>

        <p>
            Hogwarts Academy • School of Witchcraft and Wizardry
        </p>

    </footer>


    <script>


        /* =========================================
           COURSE DATA
        ========================================= */


        const classData = {

            charms: {

                name: "Charms",

                icon: "✨",

                professor: "Professor Flitwick",

                description:
                    "Master the art of magical charms and enchantments."

            },

            transfiguration: {

                name: "Transfiguration",

                icon: "🦋",

                professor: "Professor McGonagall",

                description:
                    "Learn the complex art of transforming objects and beings."

            },

            potions: {

                name: "Potions",

                icon: "⚗️",

                professor: "Professor Snape",

                description:
                    "Study magical ingredients and the creation of potions."

            },

            herbology: {

                name: "Herbology",

                icon: "🌿",

                professor: "Professor Sprout",

                description:
                    "Study magical plants and their properties."

            },

            defense: {

                name: "Defense Against the Dark Arts",

                icon: "🛡️",

                professor: "Professor Quirrell",

                description:
                    "Learn how to defend yourself against dark magic."

            },

            astronomy: {

                name: "Astronomy",

                icon: "🌙",

                professor: "Professor Sinistra",

                description:
                    "Study the stars, planets, and magical effects of the night sky."

            },

            history: {

                name: "History of Magic",

                icon: "📜",

                professor: "Professor Binns",

                description:
                    "Explore the history of the magical world."

            },

            flying: {

                name: "Flying",

                icon: "🧹",

                professor: "Madam Hooch",

                description:
                    "Learn the fundamentals of broomstick flight."

            }

        };


        /* =========================================
           GET CLASS
        ========================================= */


        const params =
            new URLSearchParams(
                window.location.search
            );


        const classId =
            params.get("class") || "charms";


        const selectedClass =
            classData[classId] ||
            classData.charms;


        /* =========================================
           DISPLAY CLASS
        ========================================= */


        document.getElementById(
            "classIcon"
        ).textContent =
            selectedClass.icon;


        document.getElementById(
            "className"
        ).textContent =
            selectedClass.name;


        document.getElementById(
            "classProfessor"
        ).textContent =
            selectedClass.professor;


        document.getElementById(
            "classDescription"
        ).textContent =
            selectedClass.description;


        /* =========================================
           PROGRESS
        ========================================= */


        let progress = 0;


        if (classId === "charms") {

            progress =
                parseInt(
                    localStorage.getItem(
                        "charmsProgress"
                    )
                ) || 0;

        }


        document.getElementById(
            "progressText"
        ).textContent =
            progress + "%";


        document.getElementById(
            "progressFill"
        ).style.width =
            progress + "%";


        /* =========================================
           LESSON DATA
        ========================================= */


        const lessons = [

            {
                number: 1,
                title: "Introduction to Charms",
                time: "15–20 minutes"
            },

            {
                number: 2,
                title: "Magical Theory",
                time: "20–25 minutes"
            },

            {
                number: 3,
                title: "Spellcasting Technique",
                time: "20–25 minutes"
            }

        ];


        /* =========================================
           CREATE LESSONS
        ========================================= */


        const lessonsList =
            document.getElementById(
                "lessonsList"
            );


        lessons.forEach(
            function(lesson) {


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "lesson-card";


                const completed =
                    lesson.number === 1 &&
                    localStorage.getItem(
                        "charmsLesson01Complete"
                    ) === "true";


                const unlocked =
                    lesson.number === 1 ||
                    completed;


                let statusText = "";

                let buttonText = "";

                let buttonAction = "";


                if (completed) {

                    statusText =
                        "✓ Completed";

                    buttonText =
                        "Review Lesson";

                    buttonAction =
                        "openLesson()";

                }

                else if (lesson.number === 1) {

                    statusText =
                        "Available";

                    buttonText =
                        "Begin Lesson";

                    buttonAction =
                        "openLesson()";

                }

                else {

                    statusText =
                        "🔒 Locked";

                    buttonText =
                        "Locked";

                    buttonAction =
                        "";

                }


                card.innerHTML = `

                    <div class="lesson-card-info">

                        <span class="lesson-number">
                            Lesson ${String(lesson.number).padStart(2, "0")}
                        </span>

                        <strong>
                            ${lesson.title}
                        </strong>

                        <small>
                            ⏱️ ${lesson.time}
                        </small>

                        <em>
                            ${statusText}
                        </em>

                    </div>


                    <button
                        ${
                            buttonAction
                            ? `onclick="${buttonAction}"`
                            : "disabled"
                        }
                    >

                        ${buttonText}

                    </button>

                `;


                lessonsList.appendChild(
                    card
                );


            }
        );


        /* =========================================
           OPEN LESSON
        ========================================= */


        function openLesson() {


            if (classId === "charms") {

                window.location.href =
                    "lesson.html";

                return;

            }


            alert(
                "This lesson will be available soon!"
            );

        }


        /* =========================================
           COURSEWORK
        ========================================= */


        function showComingSoon(section) {

            alert(
                section +
                " will be available soon!"
            );

        }


        /* =========================================
           BACK
        ========================================= */


        function goBack() {

            window.location.href =
                "classes.html";

        }


    </script>


</body>

</html>
